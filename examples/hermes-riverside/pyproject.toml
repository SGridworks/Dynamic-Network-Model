[project]
name = "hermes-riverside-poc"
version = "0.2.0"
description = "Hermes at Riverside — agentic substation copilot POC over synthetic SP&L data. Local-first inference; Bedrock-VPC gated."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sisyphean Gridworks" }]

dependencies = [
    "litellm>=1.52",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "pyarrow>=17.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
hermes = "hermes.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
